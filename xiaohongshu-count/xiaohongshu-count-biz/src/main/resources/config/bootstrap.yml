spring:
  application:
    name: xiaohongshu-count
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        server-addr: http://47.236.36.111:8848/ # 指定 Nacos 配置中心的服务器地址
        prefix: ${spring.application.name} # 配置 Data Id 前缀，这里使用应用名称作为前缀
        group: DEFAULT_GROUP # 所属组
        namespace: xiaohongshu # 命名空间
        file-extension: yaml # 配置文件格式
        refresh-enabled: true # 是否开启动态刷新
      discovery:
        enabled: true
        group: DEFAULT_GROUP
        namespace: xiaohongshu
        server-addr: http://47.236.36.111:8848/
spring:
  application:
    name: xiaohongshu-oss
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        enabled: true
        group: DEFAULT_GROUP
        namespace: xiaohongshu
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        prefix: ${spring.application.name}
        group: DEFAULT_GROUP
        namespace: xiaohongshu
        file-extension: yaml
        refresh-enabled: true
